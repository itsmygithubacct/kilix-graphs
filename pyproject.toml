[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-graphs"
version = "0.1.0"
description = "Graph creation and rendering for Kilix, Pleb and Plebian-OS"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "itsmygithubacct" }]
keywords = ["graph", "graph-drawing", "diagram", "chart", "terminal", "kitty"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Visualization",
]

# No runtime dependencies. The raster backend uses the soft-raster binding
# when it is present and reports an actionable error when it is not; every
# other path runs on a bare interpreter.
dependencies = []

[project.optional-dependencies]
raster = ["soft-raster-py"]

[project.scripts]
kilix-graphs = "kilix_graphs.cli:main"

[project.urls]
Homepage = "https://github.com/itsmygithubacct/kilix-graphs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kilix_graphs = ["py.typed"]
